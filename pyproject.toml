[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "editscreen"
version = "0.2.0a4"
description = "Screen knowledge-editing evaluation items for contamination: does the probe identify the edited subject?"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saif Ul Islam" }]
keywords = ["model-editing", "evaluation", "benchmark", "contamination", "knowledge-editing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core is standard library only, on purpose. A screen that claims to need
# no model and no GPU should not pull torch in to prove it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
editscreen = "editscreen.cli:main"

[project.urls]
Source = "https://github.com/Rubix982/editscreen"
Changelog = "https://github.com/Rubix982/editscreen/blob/main/CHANGELOG.md"
Issues = "https://github.com/Rubix982/editscreen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
