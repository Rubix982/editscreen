name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Core must stay importable with nothing installed but the stdlib.
      # The claim "no dependencies" is cheap to make and cheap to break.
      - run: python -c "import editscreen; print(editscreen.__version__)"
